<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitness Tracker SPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        canvas: '#121212',
                        card: '#1E1E1E',
                        accent: '#DC2626'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #ffffff; overscroll-behavior-y: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active { background-color: #DC2626; color: white; border-color: #DC2626; }
        .tab-inactive { background-color: #1E1E1E; color: #9CA3AF; border-color: #374151; }
    </style>
</head>
<body class="bg-canvas text-white antialiased pb-24">

    <!-- 2. Header & Status Bar -->
    <header class="fixed top-0 w-full bg-canvas/95 backdrop-blur-md z-50 border-b border-gray-800 px-4 py-3 shadow-lg">
        <div class="flex justify-between items-center mb-3">
            <div>
                <h1 class="text-xl font-black tracking-wider text-accent uppercase">Tracker</h1>
                <p class="text-xs text-gray-400 font-medium">Upper 1 | Lower 1 | Upper 2 | Lower 2</p>
            </div>
            <div id="connectionBadge" class="text-xs font-bold px-2 py-1 rounded bg-amber-900/50 text-amber-400 border border-amber-800 flex items-center gap-1 shadow-sm transition-colors">
                ⚡ Local Storage Mode
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleModal('historyModal')" class="flex-1 bg-card hover:bg-gray-800 border border-gray-700 py-1.5 rounded text-sm font-bold transition-colors shadow-sm">📜 History</button>
            <button onclick="toggleModal('exerciseModal')" class="flex-1 bg-card hover:bg-gray-800 border border-gray-700 py-1.5 rounded text-sm font-bold transition-colors shadow-sm">⚙️ Exercises</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="mt-28 px-4 max-w-lg mx-auto space-y-8">
        
        <!-- 3. Workout Tracker Module -->
        <section>
            <select id="routineSelector" class="w-full bg-card border border-gray-700 rounded-lg p-3 text-white font-bold mb-4 focus:outline-none focus:border-accent shadow-sm" onchange="loadRoutine()">
                <option value="UPPER BODY 1">Monday - UPPER BODY 1</option>
                <option value="LOWER BODY 1">Tuesday - LOWER BODY 1</option>
                <option value="UPPER BODY 2">Thursday - UPPER BODY 2</option>
                <option value="LOWER BODY 2">Friday - LOWER BODY 2</option>
            </select>

            <div class="flex items-center justify-between bg-card p-4 rounded-lg border border-gray-800 mb-4 shadow-sm">
                <div class="text-3xl font-mono tracking-widest font-bold" id="sessionTimer">00:00:00</div>
                <button id="sessionToggle" onclick="toggleSession()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-md uppercase tracking-wide">
                    ▶ Start Session
                </button>
            </div>

            <div class="flex overflow-x-auto hide-scrollbar gap-2 mb-4 py-1" id="exerciseTabs">
                <!-- Quick Tabs injected here -->
            </div>

            <div id="activeExerciseCard" class="bg-card rounded-xl border border-gray-700 p-5 shadow-lg relative hidden">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <span id="progressBadge" class="text-xs font-bold text-gray-400 tracking-wider uppercase mb-1 block">Exercise 1 of X</span>
                        <h2 id="exerciseName" class="text-2xl font-black text-white">Exercise Name</h2>
                    </div>
                    <div id="activeTimer" class="text-2xl font-mono font-bold text-accent bg-canvas px-3 py-1 rounded border border-gray-800 shadow-inner">
                        00:00
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-2 mb-5 text-center text-sm border-y border-gray-800 py-3 bg-canvas/50 rounded">
                    <div>
                        <div class="text-gray-500 text-[10px] uppercase font-bold tracking-wide">Target</div>
                        <div class="font-bold text-white mt-1" id="targetSetsReps">-</div>
                    </div>
                    <div>
                        <div class="text-gray-500 text-[10px] uppercase font-bold tracking-wide">Set</div>
                        <div class="font-black text-accent text-lg leading-none mt-1" id="currentSetLabel">1</div>
                    </div>
                    <div class="col-span-2 text-right pr-2">
                        <div class="text-gray-500 text-[10px] uppercase font-bold tracking-wide">Last Log</div>
                        <div class="font-bold text-gray-300 mt-1" id="lastLogLabel">--</div>
                    </div>
                </div>

                <div class="flex gap-3 mb-4">
                    <div class="flex-1 relative">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wide absolute -top-2 left-3 bg-card px-1">Weight (KG)</label>
                        <input type="number" id="weightInput" step="0.5" class="w-full bg-canvas border border-gray-700 rounded-lg p-3 pt-4 text-white font-bold text-xl focus:outline-none focus:border-accent text-center shadow-inner" placeholder="0.0">
                    </div>
                    <div class="flex-1 relative">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wide absolute -top-2 left-3 bg-card px-1">Reps Done</label>
                        <input type="number" id="repsInput" class="w-full bg-canvas border border-gray-700 rounded-lg p-3 pt-4 text-white font-bold text-xl focus:outline-none focus:border-accent text-center shadow-inner" placeholder="0">
                    </div>
                </div>

                <button onclick="logSet()" id="logSetBtn" class="w-full bg-accent hover:bg-red-700 text-white font-black py-4 rounded-lg shadow-lg transition-colors uppercase tracking-widest text-lg disabled:opacity-50">
                    Log Set
                </button>
                <button onclick="skipRest()" id="skipRestBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-black py-4 rounded-lg shadow-lg transition-colors uppercase tracking-widest text-lg hidden">
                    Skip Rest
                </button>
                <button onclick="nextExercise()" id="nextExerciseBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-lg shadow-lg transition-colors uppercase tracking-widest text-lg hidden">
                    ▶ Resume Next
                </button>
            </div>

            <div class="mt-6">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3 border-b border-gray-800 pb-1">Today's Sets</h3>
                <div id="todayLogs" class="space-y-3"></div>
            </div>
        </section>

        <hr class="border-gray-800">

        <!-- 4. Bodyweight Log Book & Weekly Summary -->
        <section>
            <h2 class="text-lg font-black uppercase tracking-wider mb-4 text-accent">⚖️ Bodyweight Tracker</h2>
            <div class="bg-card p-4 rounded-xl border border-gray-700 mb-4 shadow-sm flex gap-3">
                <input type="date" id="bwDate" class="bg-canvas border border-gray-700 rounded-lg p-2 text-sm font-bold flex-1 focus:border-accent focus:outline-none">
                <input type="number" id="bwWeight" step="0.1" placeholder="KG" class="bg-canvas border border-gray-700 rounded-lg p-2 text-sm font-bold w-24 text-center focus:border-accent focus:outline-none">
                <button onclick="logBodyweight()" class="bg-accent text-white px-4 rounded-lg font-bold shadow-md hover:bg-red-700">Save</button>
            </div>
            
            <!-- Weekly Summary Accordion -->
            <details class="bg-card border border-gray-700 rounded-xl shadow-sm mb-4 group cursor-pointer">
                <summary class="p-4 font-bold text-sm uppercase tracking-wide flex justify-between items-center outline-none">
                    Weekly Summaries
                    <span class="text-gray-500 group-open:rotate-180 transition-transform">▼</span>
                </summary>
                <div id="bwWeeklySummary" class="p-4 pt-0 space-y-2 border-t border-gray-800 mt-2"></div>
            </details>

            <div class="bg-card border border-gray-700 rounded-xl overflow-hidden shadow-sm">
                <div class="max-h-48 overflow-y-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-400 uppercase bg-canvas sticky top-0">
                            <tr>
                                <th class="px-4 py-2">Date</th>
                                <th class="px-4 py-2">Weight</th>
                                <th class="px-4 py-2 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="bwHistory" class="divide-y divide-gray-800 font-medium"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <hr class="border-gray-800">

        <!-- 5. Nutrition & Macro Plan Tracker -->
        <section>
            <h2 class="text-lg font-black uppercase tracking-wider mb-4 text-accent">🍎 Macro Tracker</h2>
            
            <div class="flex gap-2 mb-4">
                <select id="macroDayType" class="flex-1 bg-card border border-gray-700 rounded-lg p-2 text-sm font-bold focus:border-accent outline-none shadow-sm" onchange="renderNutrition()">
                    <option value="Training">Training Day</option>
                    <option value="Rest">Non-Training Day</option>
                </select>
                <select id="macroCategory" class="flex-1 bg-card border border-gray-700 rounded-lg p-2 text-sm font-bold focus:border-accent outline-none shadow-sm" onchange="renderNutrition()">
                    <option value="ALL">All Meals</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Pre-Workout">Pre-Workout</option>
                    <option value="Post-Workout">Post-Workout</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Snack">Snack</option>
                </select>
            </div>

            <!-- Daily Macro Summary Banner -->
            <div class="bg-card border border-gray-700 p-3 rounded-xl flex justify-around text-center text-sm shadow-md mb-4 sticky top-24 z-40">
                <div><div class="text-gray-500 text-[10px] font-bold uppercase tracking-wide">Kcal</div><div id="macroKcal" class="font-black text-white text-lg">0</div></div>
                <div><div class="text-gray-500 text-[10px] font-bold uppercase tracking-wide">Pro</div><div id="macroPro" class="font-black text-emerald-400 text-lg">0g</div></div>
                <div><div class="text-gray-500 text-[10px] font-bold uppercase tracking-wide">Carb</div><div id="macroCarb" class="font-black text-blue-400 text-lg">0g</div></div>
                <div><div class="text-gray-500 text-[10px] font-bold uppercase tracking-wide">Fat</div><div id="macroFat" class="font-black text-amber-400 text-lg">0g</div></div>
            </div>

            <div id="nutritionList" class="space-y-3 mb-4"></div>
            
            <div class="flex gap-2">
                <button onclick="addFoodModal()" class="flex-1 bg-card hover:bg-gray-800 py-3 rounded-xl text-sm font-black border border-dashed border-gray-600 text-accent uppercase tracking-wide transition-colors">➕ Add Food</button>
                <button onclick="resetMacros()" class="bg-card hover:bg-gray-800 px-4 rounded-xl text-sm font-black border border-gray-700 text-gray-400 uppercase transition-colors" title="Reset Default Meals">↺</button>
            </div>
        </section>
    </main>

    <!-- 6. Management Modals -->
    <!-- History Modal -->
    <div id="historyModal" class="fixed inset-0 bg-canvas/95 backdrop-blur z-[60] hidden flex-col">
        <div class="bg-card p-4 flex justify-between items-center border-b border-gray-800 shadow-md">
            <h2 class="text-lg font-black uppercase tracking-wider">📜 History</h2>
            <button onclick="toggleModal('historyModal')" class="text-gray-400 hover:text-white p-2 font-bold">✕</button>
        </div>
        <div class="p-4 flex-1 overflow-y-auto">
            <select id="historyFilter" class="w-full bg-card border border-gray-700 rounded-lg p-3 mb-4 font-bold outline-none focus:border-accent" onchange="renderHistory()">
                <option value="ALL">ALL ROUTINES</option>
                <option value="UPPER BODY 1">UPPER BODY 1</option>
                <option value="LOWER BODY 1">LOWER BODY 1</option>
                <option value="UPPER BODY 2">UPPER BODY 2</option>
                <option value="LOWER BODY 2">LOWER BODY 2</option>
            </select>
            <div id="historyList" class="space-y-3"></div>
        </div>
    </div>

    <!-- Exercise Modal -->
    <div id="exerciseModal" class="fixed inset-0 bg-canvas/95 backdrop-blur z-[60] hidden flex-col">
        <div class="bg-card p-4 flex justify-between items-center border-b border-gray-800 shadow-md">
            <h2 class="text-lg font-black uppercase tracking-wider">⚙️ Exercises</h2>
            <button onclick="toggleModal('exerciseModal')" class="text-gray-400 hover:text-white p-2 font-bold">✕</button>
        </div>
        <div class="p-4 flex-1 overflow-y-auto">
            <select id="editRoutineSelector" class="w-full bg-card border border-gray-700 rounded-lg p-3 mb-4 font-bold outline-none focus:border-accent" onchange="renderExerciseEditor()">
                <option value="UPPER BODY 1">UPPER BODY 1</option>
                <option value="LOWER BODY 1">LOWER BODY 1</option>
                <option value="UPPER BODY 2">UPPER BODY 2</option>
                <option value="LOWER BODY 2">LOWER BODY 2</option>
            </select>
            <div id="exerciseEditList" class="space-y-3 mb-6"></div>
            <button onclick="addCustomExercise()" class="w-full bg-card py-3 rounded-lg text-sm font-black uppercase tracking-wide border border-dashed border-gray-600 mb-3 hover:bg-gray-800 transition-colors">➕ Add Exercise</button>
            <button onclick="resetDefaultExercises()" class="w-full bg-red-900/20 text-accent py-3 rounded-lg text-sm font-black uppercase tracking-wide border border-red-900/50 hover:bg-red-900/40 transition-colors">↺ Reset Defaults</button>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // Supabase Configuration
        const SUPABASE_URL = 'https://mapvvhplnavtsewwzrcr.supabase.co/rest/v1';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hcHZ2aHBsbmF2dHNld3d6cmNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNDE5NjIsImV4cCI6MjEwNTcxNzk2Mn0.-E1uFRp-hkZ3zeIfnEKFe490xqZu6dx3j5TZL83xCbM';
        const HEADERS = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        // Default Configurations
        const DEFAULT_ROUTINES = {
            "UPPER BODY 1": [
                {name: "Bench Press", sets: 4, reps: "8-10"},
                {name: "Incline DB Press", sets: 3, reps: "8-12"},
                {name: "Pull-Ups", sets: 4, reps: "8-12"},
                {name: "Barbell Row", sets: 3, reps: "8-10"}
            ],
            "LOWER BODY 1": [
                {name: "Squats", sets: 4, reps: "6-8"},
                {name: "Romanian Deadlift", sets: 3, reps: "8-10"},
                {name: "Leg Press", sets: 3, reps: "10-12"}
            ],
            "UPPER BODY 2": [
                {name: "Overhead Press", sets: 4, reps: "8-10"},
                {name: "Lat Pulldown", sets: 3, reps: "8-12"}
            ],
            "LOWER BODY 2": [
                {name: "Deadlift", sets: 4, reps: "5-8"},
                {name: "Hack Squat", sets: 3, reps: "8-10"}
            ]
        };

        // State Variables
        let isOnline = navigator.onLine;
        let activeRoutine = [];
        let currentExIndex = 0;
        let currentSet = 1;
        let sessionActive = false;
        
        let sessionStartTime = 0;
        let setStartTime = 0;
        let restEndTime = 0;
        let isResting = false;
        
        let logs = JSON.parse(localStorage.getItem('logs') || '[]');
        let bodyweightData = JSON.parse(localStorage.getItem('bodyweightData') || '[]');
        let customExercises = JSON.parse(localStorage.getItem('customExercises') || 'null');
        let nutritionData = JSON.parse(localStorage.getItem('nutritionData') || '[]');
        
        let wakeLock = null;
        let audioCtx = null;
        let silentAudio = null;

        // Background Web Worker
        const workerBlob = new Blob([`
            let timer;
            self.onmessage = function(e) {
                if (e.data === 'start') {
                    if (timer) clearInterval(timer);
                    timer = setInterval(() => self.postMessage('tick'), 1000);
                } else if (e.data === 'stop') {
                    clearInterval(timer);
                }
            };
        `], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(workerBlob));
        worker.onmessage = handleTick;

        // Initialization
        window.addEventListener('online', () => { isOnline = true; updateBadge(); fetchSupabaseData(); });
        window.addEventListener('offline', () => { isOnline = false; updateBadge(); });

        document.getElementById('bwDate').valueAsDate = new Date();

        if (!customExercises) {
            customExercises = JSON.parse(JSON.stringify(DEFAULT_ROUTINES));
            localStorage.setItem('customExercises', JSON.stringify(customExercises));
        }

        restoreSessionState();
        loadRoutine();
        updateBadge();
        renderBodyweight();
        renderNutrition();
        fetchSupabaseData();

        function updateBadge() {
            const badge = document.getElementById('connectionBadge');
            if (isOnline) {
                badge.innerHTML = '⚡ Supabase Connected';
                badge.className = 'text-xs font-bold px-2 py-1 rounded bg-emerald-900/40 text-emerald-400 border border-emerald-800 flex items-center shadow-sm';
            } else {
                badge.innerHTML = '⚡ Local Storage Mode';
                badge.className = 'text-xs font-bold px-2 py-1 rounded bg-amber-900/40 text-amber-400 border border-amber-800 flex items-center shadow-sm';
            }
        }

        // ================= WORKOUT MODULE =================

        function loadRoutine() {
            const day = document.getElementById('routineSelector').value;
            activeRoutine = customExercises[day] || DEFAULT_ROUTINES[day];
            renderTabs();
            renderActiveExercise();
            renderTodayLogs();
            if (sessionActive) saveSessionState();
        }

        function renderTabs() {
            const container = document.getElementById('exerciseTabs');
            container.innerHTML = activeRoutine.map((ex, idx) => `
                <button onclick="jumpToExercise(${idx})" class="whitespace-nowrap px-4 py-2 rounded-full text-xs font-black uppercase tracking-wider border transition-colors ${idx === currentExIndex ? 'tab-active' : 'tab-inactive'}">
                    ${idx + 1}. ${ex.name}
                </button>
            `).join('');
        }

        function jumpToExercise(idx) {
            if (!sessionActive) return;
            currentExIndex = idx;
            currentSet = 1;
            isResting = false;
            setStartTime = Date.now();
            renderTabs();
            renderActiveExercise();
            saveSessionState();
            
            const tabs = document.getElementById('exerciseTabs').children;
            if(tabs[idx]) tabs[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }

        function renderActiveExercise() {
            if (activeRoutine.length === 0) return;
            const ex = activeRoutine[currentExIndex];
            
            document.getElementById('progressBadge').innerText = `Exercise ${currentExIndex + 1} of ${activeRoutine.length}`;
            document.getElementById('exerciseName').innerText = ex.name;
            document.getElementById('targetSetsReps').innerText = `${ex.sets} × ${ex.reps}`;
            document.getElementById('currentSetLabel').innerText = currentSet;
            
            // Last Log Logic
            const pastLogs = logs.filter(l => l.exercise === ex.name && l.routine === document.getElementById('routineSelector').value);
            if (pastLogs.length > 0) {
                pastLogs.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                const lastSessionDate = pastLogs[0].created_at.split('T')[0];
                const lastSessionLogs = pastLogs.filter(l => l.created_at.startsWith(lastSessionDate));
                const weights = lastSessionLogs.map(l => parseFloat(l.weight)).filter(w => !isNaN(w) && w > 0);
                const minReps = Math.min(...lastSessionLogs.map(l => parseInt(l.reps)));
                
                if (weights.length > 0) {
                    const maxWeight = Math.max(...weights);
                    document.getElementById('lastLogLabel').innerText = `${maxWeight}kg × ${minReps} (min)`;
                    if(!document.getElementById('weightInput').value) document.getElementById('weightInput').value = maxWeight;
                } else {
                    document.getElementById('lastLogLabel').innerText = `BW × ${minReps}`;
                }
            } else {
                document.getElementById('lastLogLabel').innerText = '--';
            }

            const isDone = currentSet > ex.sets;
            document.getElementById('logSetBtn').classList.toggle('hidden', isDone || isResting);
            document.getElementById('skipRestBtn').classList.toggle('hidden', !isResting);
            document.getElementById('nextExerciseBtn').classList.toggle('hidden', !isDone);
        }

        async function logSet() {
            if (!sessionActive) return;
            const w = document.getElementById('weightInput').value || 0;
            const r = document.getElementById('repsInput').value;
            if (!r) return alert('Enter reps performed.');

            const ex = activeRoutine[currentExIndex];
            const setDuration = formatTime(Math.floor((Date.now() - setStartTime) / 1000));
            
            const logEntry = {
                id: crypto.randomUUID(),
                created_at: new Date().toISOString(),
                routine: document.getElementById('routineSelector').value,
                exercise: ex.name,
                set_number: currentSet,
                weight: w,
                reps: r,
                duration: setDuration
            };

            logs.push(logEntry);
            localStorage.setItem('logs', JSON.stringify(logs));
            renderTodayLogs();

            if (isOnline) {
                fetch(`${SUPABASE_URL}/workout_logs`, { method: 'POST', headers: HEADERS, body: JSON.stringify(logEntry) }).catch(console.error);
            }

            // Auto-Rest Logic
            isResting = true;
            const restTarget = ex.sets >= 4 ? 90 : 60;
            restEndTime = Date.now() + (restTarget * 1000);
            
            document.getElementById('repsInput').value = '';
            renderActiveExercise();
            saveSessionState();
        }

        function skipRest() {
            isResting = false;
            setStartTime = Date.now(); // Active timer starts from 00:00
            currentSet++;
            renderActiveExercise();
            saveSessionState();
        }

        function nextExercise() {
            if (currentExIndex < activeRoutine.length - 1) {
                jumpToExercise(currentExIndex + 1);
            } else {
                alert('Routine Complete!');
                toggleSession();
            }
        }

        function renderTodayLogs() {
            const today = new Date().toISOString().split('T')[0];
            const routine = document.getElementById('routineSelector').value;
            const todayLogs = logs.filter(l => l.created_at.startsWith(today) && l.routine === routine);
            
            const container = document.getElementById('todayLogs');
            container.innerHTML = '';
            
            const grouped = {};
            todayLogs.forEach(l => {
                if(!grouped[l.exercise]) grouped[l.exercise] = [];
                grouped[l.exercise].push(l);
            });

            for (const [exName, exLogs] of Object.entries(grouped)) {
                let html = `<div class="bg-card border border-gray-700 rounded-lg p-3 shadow-sm">
                    <h4 class="font-bold text-accent mb-2 text-sm uppercase tracking-wide">${exName}</h4>
                    <div class="space-y-1">`;
                exLogs.forEach(l => {
                    html += `<div class="flex justify-between items-center text-sm font-medium text-gray-300 bg-canvas rounded px-3 py-1.5 border border-gray-800">
                        <span>Set ${l.set_number} <span class="text-gray-500 mx-1">|</span> ${l.weight}kg × ${l.reps}</span>
                        <div class="flex items-center gap-4">
                            <span class="text-xs text-gray-500 font-mono">⏱ ${l.duration}</span>
                            <button onclick="deleteLog('${l.id}')" class="text-gray-500 hover:text-red-500 text-lg leading-none">✕</button>
                        </div>
                    </div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        async function deleteLog(id) {
            logs = logs.filter(l => l.id !== id);
            localStorage.setItem('logs', JSON.stringify(logs));
            renderTodayLogs();
            if (isOnline) {
                fetch(`${SUPABASE_URL}/workout_logs?id=eq.${id}`, { method: 'DELETE', headers: HEADERS }).catch(console.error);
            }
        }

        // ================= TIMER & WORKERS =================

        async function toggleSession() {
            const btn = document.getElementById('sessionToggle');
            const card = document.getElementById('activeExerciseCard');
            
            if (!sessionActive) {
                sessionActive = true;
                sessionStartTime = Date.now();
                setStartTime = Date.now();
                isResting = false;
                currentSet = 1;
                
                btn.innerHTML = '⏹ Stop Session';
                btn.className = 'bg-red-700 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-md uppercase tracking-wide';
                card.classList.remove('hidden');
                
                worker.postMessage('start');
                requestWakeLock();
                initAudio();
                
                document.getElementById('routineSelector').disabled = true;
                renderActiveExercise();
                saveSessionState();
            } else {
                sessionActive = false;
                btn.innerHTML = '▶ Start Session';
                btn.className = 'bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-md uppercase tracking-wide';
                card.classList.add('hidden');
                
                worker.postMessage('stop');
                if (wakeLock) wakeLock.release().then(() => wakeLock = null);
                if (silentAudio) { silentAudio.pause(); silentAudio = null; }
                
                document.getElementById('routineSelector').disabled = false;
                localStorage.removeItem('activeSessionState');
                document.getElementById('sessionTimer').innerText = '00:00:00';
            }
        }

        function handleTick() {
            if (!sessionActive) return;
            
            const sessionElapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            document.getElementById('sessionTimer').innerText = formatTime(sessionElapsed, true);
            
            const activeTimerEl = document.getElementById('activeTimer');
            
            if (isResting) {
                const remaining = Math.ceil((restEndTime - Date.now()) / 1000);
                if (remaining <= 0) {
                    // ====== THE TIMER FIX IS HERE ======
                    isResting = false;
                    setStartTime = Date.now(); // Set starts at 00:00
                    currentSet++;
                    renderActiveExercise();
                    playBeep();
                    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
                    saveSessionState();
                } else {
                    activeTimerEl.innerText = formatTime(remaining);
                    activeTimerEl.className = 'text-2xl font-mono font-bold text-amber-500 bg-canvas px-3 py-1 rounded border border-amber-900/50 shadow-inner';
                }
            } else {
                const setElapsed = Math.floor((Date.now() - setStartTime) / 1000);
                activeTimerEl.innerText = formatTime(setElapsed);
                activeTimerEl.className = 'text-2xl font-mono font-bold text-accent bg-canvas px-3 py-1 rounded border border-gray-800 shadow-inner';
            }
            
            if (sessionElapsed % 5 === 0) saveSessionState();
        }

        function saveSessionState() {
            if (!sessionActive) return;
            localStorage.setItem('activeSessionState', JSON.stringify({
                routine: document.getElementById('routineSelector').value,
                sessionStartTime, setStartTime, restEndTime, isResting, currentExIndex, currentSet
            }));
        }

        function restoreSessionState() {
            const state = JSON.parse(localStorage.getItem('activeSessionState'));
            if (state && (Date.now() - state.sessionStartTime) < 12 * 60 * 60 * 1000) { 
                document.getElementById('routineSelector').value = state.routine;
                sessionStartTime = state.sessionStartTime;
                setStartTime = state.setStartTime;
                restEndTime = state.restEndTime;
                isResting = state.isResting;
                currentExIndex = state.currentExIndex;
                currentSet = state.currentSet;
                
                toggleSession();
                renderActiveExercise();
            } else {
                localStorage.removeItem('activeSessionState');
            }
        }

        function formatTime(s, includeHours = false) {
            if(s < 0) s = 0;
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), secs = s % 60;
            const ms = `${m.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            return includeHours ? `${h.toString().padStart(2, '0')}:${ms}` : ms;
        }

        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!silentAudio) {
                silentAudio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
                silentAudio.loop = true;
                silentAudio.play().catch(()=>{});
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        // ================= BODYWEIGHT MODULE =================

        async function logBodyweight() {
            const date = document.getElementById('bwDate').value;
            const weight = parseFloat(document.getElementById('bwWeight').value);
            if (!date || !weight) return;

            const entry = { id: crypto.randomUUID(), date, weight };
            bodyweightData.push(entry);
            localStorage.setItem('bodyweightData', JSON.stringify(bodyweightData));
            renderBodyweight();
            document.getElementById('bwWeight').value = '';

            if (isOnline) {
                fetch(`${SUPABASE_URL}/bodyweight_logs`, { method: 'POST', headers: HEADERS, body: JSON.stringify(entry) }).catch(console.error);
            }
        }

        function renderBodyweight() {
            bodyweightData.sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('bwHistory').innerHTML = bodyweightData.map(b => `
                <tr class="hover:bg-gray-800/50">
                    <td class="px-4 py-3 border-b border-gray-800 text-gray-400">${b.date}</td>
                    <td class="px-4 py-3 border-b border-gray-800 text-white font-bold">${b.weight} kg</td>
                    <td class="px-4 py-3 border-b border-gray-800 text-right"><button onclick="deleteBw('${b.id}')" class="text-red-900 hover:text-red-500 font-black">✕</button></td>
                </tr>
            `).join('');

            const weeks = {};
            bodyweightData.forEach(entry => {
                const d = new Date(entry.date);
                const day = d.getDay();
                const diff = d.getDate() - day + (day === 0 ? 0 : 7);
                const sunday = new Date(d.setDate(diff));
                const key = sunday.toISOString().split('T')[0];
                if(!weeks[key]) weeks[key] = [];
                weeks[key].push(entry.weight);
            });

            const sortedWeeks = Object.keys(weeks).sort((a,b) => new Date(b) - new Date(a));
            let html = '';
            for (let i=0; i<sortedWeeks.length; i++) {
                const w = sortedWeeks[i];
                const avg = (weeks[w].reduce((a,b)=>a+b,0) / weeks[w].length).toFixed(1);
                
                let delta = `<span class="text-gray-500 font-bold">➡️ Baseline</span>`;
                if (i < sortedWeeks.length - 1) {
                    const prevAvg = (weeks[sortedWeeks[i+1]].reduce((a,b)=>a+b,0) / weeks[sortedWeeks[i+1]].length).toFixed(1);
                    const diff = (avg - prevAvg).toFixed(1);
                    if (diff > 0) delta = `<span class="text-accent font-black">🔺 +${diff} kg</span>`;
                    else if (diff < 0) delta = `<span class="text-emerald-400 font-black">🔻 ${diff} kg</span>`;
                    else delta = `<span class="text-gray-500 font-bold">➡️ 0.0 kg</span>`;
                }

                html += `<div class="bg-canvas border border-gray-800 rounded p-3 flex justify-between items-center">
                    <div><div class="text-[10px] text-gray-500 uppercase font-bold">Week ending ${w}</div>
                    <div class="font-black text-white text-lg">${avg} kg avg</div></div>
                    <div>${delta}</div>
                </div>`;
            }
            document.getElementById('bwWeeklySummary').innerHTML = html || '<div class="text-sm text-gray-500">No data logged yet.</div>';
        }

        function deleteBw(id) {
            bodyweightData = bodyweightData.filter(b => b.id !== id);
            localStorage.setItem('bodyweightData', JSON.stringify(bodyweightData));
            renderBodyweight();
        }

        // ================= NUTRITION MODULE =================

        function renderNutrition() {
            const dayType = document.getElementById('macroDayType').value;
            const category = document.getElementById('macroCategory').value;
            
            let filtered = nutritionData.filter(n => n.dayType === dayType);
            if (category !== 'ALL') filtered = filtered.filter(n => n.category === category);

            document.getElementById('nutritionList').innerHTML = filtered.map(n => `
                <div class="bg-card border border-gray-700 rounded-xl p-4 relative shadow-sm">
                    <button onclick="deleteFood('${n.id}')" class="absolute top-4 right-4 text-gray-600 hover:text-red-500 font-black">✕</button>
                    <div class="text-[10px] text-accent font-black uppercase tracking-wider mb-1">${n.category}</div>
                    <div class="font-black text-lg text-white mb-3">${n.name} <span class="text-sm font-medium text-gray-400">(${n.weight}g)</span></div>
                    <div class="flex gap-2 text-sm bg-canvas rounded-lg px-3 py-2 border border-gray-800 shadow-inner">
                        <div class="flex-1 text-center"><div class="text-gray-500 text-[10px] font-bold">KCAL</div><div class="font-black">${n.kcal}</div></div>
                        <div class="flex-1 text-center"><div class="text-gray-500 text-[10px] font-bold">PRO</div><div class="font-black text-emerald-400">${n.pro}g</div></div>
                        <div class="flex-1 text-center"><div class="text-gray-500 text-[10px] font-bold">CARB</div><div class="font-black text-blue-400">${n.carb}g</div></div>
                        <div class="flex-1 text-center"><div class="text-gray-500 text-[10px] font-bold">FAT</div><div class="font-black text-amber-400">${n.fat}g</div></div>
                    </div>
                </div>
            `).join('');

            const fullDay = nutritionData.filter(n => n.dayType === dayType);
            let dK = 0, dP = 0, dC = 0, dF = 0;
            fullDay.forEach(n => { dK+=n.kcal; dP+=n.pro; dC+=n.carb; dF+=n.fat; });

            document.getElementById('macroKcal').innerText = dK;
            document.getElementById('macroPro').innerText = dP + 'g';
            document.getElementById('macroCarb').innerText = dC + 'g';
            document.getElementById('macroFat').innerText = dF + 'g';
        }

        function addFoodModal() {
            const dayType = document.getElementById('macroDayType').value;
            const cat = document.getElementById('macroCategory').value === 'ALL' ? 'Breakfast' : document.getElementById('macroCategory').value;
            
            const name = prompt('Food Name:'); if(!name) return;
            const weight = parseFloat(prompt('Portion Weight (g):') || 0);
            const pro = parseFloat(prompt('Protein (g):') || 0);
            const carb = parseFloat(prompt('Carbs (g):') || 0);
            const fat = parseFloat(prompt('Fats (g):') || 0);
            const kcal = Math.round((pro * 4) + (carb * 4) + (fat * 9));

            const entry = { id: crypto.randomUUID(), dayType, category: cat, name, weight, pro, carb, fat, kcal };
            nutritionData.push(entry);
            localStorage.setItem('nutritionData', JSON.stringify(nutritionData));
            renderNutrition();
        }

        function deleteFood(id) {
            nutritionData = nutritionData.filter(n => n.id !== id);
            localStorage.setItem('nutritionData', JSON.stringify(nutritionData));
            renderNutrition();
        }

        function resetMacros() {
            if(confirm('Clear all food data?')) {
                nutritionData = [];
                localStorage.setItem('nutritionData', '[]');
                renderNutrition();
            }
        }

        // ================= MODALS & SYNC =================

        function toggleModal(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden'); el.classList.add('flex');
                if (id === 'historyModal') renderHistory();
                if (id === 'exerciseModal') renderExerciseEditor();
            } else {
                el.classList.add('hidden'); el.classList.remove('flex');
            }
        }

        function renderHistory() {
            const filter = document.getElementById('historyFilter').value;
            let d = [...logs].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            if (filter !== 'ALL') d = d.filter(l => l.routine === filter);

            document.getElementById('historyList').innerHTML = d.map(l => `
                <div class="bg-card border border-gray-700 rounded-lg p-3 shadow-sm">
                    <div class="flex justify-between text-[10px] text-gray-400 mb-1 font-bold uppercase">
                        <span>${l.created_at.split('T')[0]} • ${l.routine}</span>
                        <span>⏱ ${l.duration}</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-black text-white text-sm">${l.exercise}</span>
                        <span class="font-mono text-xs text-accent bg-canvas px-2 py-1 rounded border border-gray-800">Set ${l.set_number} | ${l.weight}kg × ${l.reps}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderExerciseEditor() {
            const r = document.getElementById('editRoutineSelector').value;
            document.getElementById('exerciseEditList').innerHTML = customExercises[r].map((ex, idx) => `
                <div class="bg-card border border-gray-700 rounded-lg p-3 relative shadow-sm">
                    <input type="text" value="${ex.name}" class="bg-canvas border border-gray-800 rounded p-2 text-white font-black text-sm w-full mb-2 outline-none focus:border-accent" onchange="updateEx(${idx}, 'name', this.value)">
                    <div class="flex gap-2">
                        <div class="flex-1 flex items-center bg-canvas border border-gray-800 rounded px-2">
                            <span class="text-[10px] text-gray-500 font-bold uppercase w-8">Sets</span>
                            <input type="number" value="${ex.sets}" class="bg-transparent text-white font-black p-2 w-full text-center outline-none" onchange="updateEx(${idx}, 'sets', parseInt(this.value))">
                        </div>
                        <div class="flex-1 flex items-center bg-canvas border border-gray-800 rounded px-2">
                            <span class="text-[10px] text-gray-500 font-bold uppercase w-8">Reps</span>
                            <input type="text" value="${ex.reps}" class="bg-transparent text-white font-black p-2 w-full text-center outline-none" onchange="updateEx(${idx}, 'reps', this.value)">
                        </div>
                    </div>
                    <button onclick="removeEx(${idx})" class="absolute top-2 right-2 text-red-900 hover:text-red-500 font-black px-2">✕</button>
                </div>
            `).join('');
        }

        function updateEx(idx, f, v) { customExercises[document.getElementById('editRoutineSelector').value][idx][f] = v; localStorage.setItem('customExercises', JSON.stringify(customExercises)); loadRoutine(); }
        function removeEx(idx) { customExercises[document.getElementById('editRoutineSelector').value].splice(idx, 1); localStorage.setItem('customExercises', JSON.stringify(customExercises)); renderExerciseEditor(); loadRoutine(); }
        function addCustomExercise() { customExercises[document.getElementById('editRoutineSelector').value].push({name: "New Exercise", sets: 3, reps: "8-12"}); localStorage.setItem('customExercises', JSON.stringify(customExercises)); renderExerciseEditor(); loadRoutine(); }
        function resetDefaultExercises() { if(confirm('Reset all to default?')) { customExercises = JSON.parse(JSON.stringify(DEFAULT_ROUTINES)); localStorage.setItem('customExercises', JSON.stringify(customExercises)); renderExerciseEditor(); loadRoutine(); } }

        async function fetchSupabaseData() {
            if (!isOnline) return;
            try {
                const [rL, rB] = await Promise.all([
                    fetch(`${SUPABASE_URL}/workout_logs?select=*`, { headers: HEADERS }),
                    fetch(`${SUPABASE_URL}/bodyweight_logs?select=*`, { headers: HEADERS })
                ]);
                if (rL.ok) { const dbL = await rL.json(); if(dbL.length > logs.length) { logs = dbL; localStorage.setItem('logs', JSON.stringify(logs)); renderTodayLogs(); } }
                if (rB.ok) { const dbB = await rB.json(); if(dbB.length > bodyweightData.length) { bodyweightData = dbB; localStorage.setItem('bodyweightData', JSON.stringify(bodyweightData)); renderBodyweight(); } }
            } catch(e) {}
        }
    </script>
